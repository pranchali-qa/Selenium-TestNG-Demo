name: every push to main branch triggers the workflow

on:
  # push:
  #   branches:
  #     - main
  #   schedule:
  #     - cron: '25 22 * * *' # Runs at 1:00 AM UTC every Monday through Friday
  # # workflow_dispatch:
  schedule:
    - cron: '32 12 * * *' # Runs at 5:40 PM UTC every day
  workflow_dispatch:
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      
      - name: Verify Chrome
        run: google-chrome --version
        
      - name: Build and Test with Maven
        working-directory: SeleniumDemo
        env:
          USERNAME: ${{ secrets.USERNAME }}
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
        run: mvn clean test
          
