name: nightly selenium test with maven
on:
  # schedule:
  #   - cron: '0 1 * * 1-5' # Runs at 1:00 AM UTC every Monday through Friday
  workflow_dispatch:
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build and Test with Maven
        run: mvn -B clean test -DsuiteXmlFile=testng.xml